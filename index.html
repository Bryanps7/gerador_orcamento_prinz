<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Orçamento — Vidraçaria Prinz</title>

    <link rel="stylesheet" href="./assets/styles/config.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="icon" href="./public/logo.png" type="image/png">

    <script src="./assets/js/index.js" defer></script>
</head>

<body>
    <div class="page">

        <header class="page-header">
            <img class="page-header__logo" src="./public/logo.png" alt="Logotipo Vidraçaria Prinz">
            <div>
                <h1>Gerador de Orçamentos</h1>
                <p class="subtitle">Vidraçaria Prinz</p>
            </div>
        </header>

        <main class="layout">

            <!-- Formulário -->
            <section class="card form-card">
                <h2 class="card__title">1. Dados do orçamento</h2>

                <div class="field">
                    <label for="itens">Quantos itens você vai precisar?</label>
                    <input type="number" id="itens" min="1" placeholder="Ex: 3">
                </div>

                <button class="btn btn--primary" id="cads">Cadastrar itens</button>

                <div id="imprima"></div>
            </section>

            <!-- Prévia do orçamento -->
            <section class="card preview-card" id="orcamento">
                <div id="orcamento-about"></div>

                <div class="table">
                    <table>
                        <thead id="thead"></thead>
                        <tbody id="tbody"></tbody>
                        <tfoot id="tfoot"></tfoot>
                    </table>
                </div>

                <div id="orcamento-footer"></div>

                <div id="orcamento-empty" class="empty-state">
                    <strong>Nenhum orçamento gerado ainda</strong>
                    <p>Preencha os dados ao lado e clique em "Visualizar Orçamento" para ver a prévia aqui.</p>
                </div>
            </section>

        </main>

        <div class="actions">
            <button id="baixar-pdf" class="btn btn--accent">Gerar PDF do Orçamento</button>
        </div>

    </div>
</body>
</html>
